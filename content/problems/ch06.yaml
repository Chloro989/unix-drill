chapter: 6
title: 正規表現
problems:
  - id: 6-01
    title: 行頭を表す記号
    scenario: |
      この章では {strings} を使う。短い文字列が 1 行に 1 つ並んだファイルで、
      どのテーマを選んでも中身は同じ。まず中を見ておくとよい。
    prompt: 正規表現で「行の先頭」を表す記号はどれか。番号で答えよ。
    choices:
      - "$"
      - "^"
      - "."
      - "*"
    judge:
      mode: text
    accept:
      - "2"
    solution: "2"
    hints:
      - 屋根のような形の記号です。
      - キャレットです。
      - "2"
    explain: |
      ^ が行頭、$ が行末。この 2 つは対で覚えます。
      ^ は [ ] の中に書くと意味が変わり、「以外」を表します（6-09 で扱います）。

  - id: 6-02
    title: A で始まる行
    prompt: "{strings} から、A で始まる行だけを表示せよ。"
    solution: grep "^A" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - 行頭を表す記号を、探す文字の前に置きます。
      - "\"^A\" を grep に渡します。"
      - grep "^A" {strings}
    explain: |
      引用符を付けるのは、記号をシェルに解釈させないためです。
      ^ は今回は問題になりませんが、* や ? では引用符の有無が結果を変えます。
      常に引用符で囲む癖をつけておくと安全です。

  - id: 6-03
    title: T で終わる行
    prompt: "{strings} から、T で終わる行だけを表示せよ。"
    solution: grep "T$" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - 行末を表す記号を、探す文字のうしろに置きます。
      - "\"T$\" を grep に渡します。"
      - grep "T$" {strings}
    explain: |
      $ を付けないと、途中に T を含む行もすべて拾ってしまいます。
      「含む」と「終わる」は違う、という区別が正規表現の第一歩です。

  - id: 6-04
    title: 全体で一致させる
    prompt: "{strings} から、A で始まり T で終わる行だけを表示せよ。"
    solution: grep "^A.*T$" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - 行頭と行末の記号を両方使い、あいだを「何でもよい」で埋めます。
      - "「任意の 1 文字」の . と「直前の 0 回以上の繰り返し」の * を組み合わせて .* と書きます。"
      - grep "^A.*T$" {strings}
    explain: |
      . は任意の 1 文字、* は「直前の要素の 0 回以上の繰り返し」。
      合わせた .* が「何でもよい、長さも問わない」を表します。
      ^ と $ で挟むと、行全体を一致させる形になります。

  - id: 6-05
    title: 入試で問われる形
    prompt: "{strings} から、正規表現 ^A[CG]*[^CG]?T$ に一致する行を表示せよ。"
    solution: grep -E "^A[CG]*[^CG]?T$" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - "? を使うので、拡張正規表現を有効にするオプションが要ります。"
      - "-E を付けて、パターンをそのまま引用符で囲んで渡します。"
      - grep -E "^A[CG]*[^CG]?T$" {strings}
    platform_note: -E を付けないと ? が特別な意味を持たず、うまく動きません。
    explain: |
      入試のサンプル問題でも、この形の正規表現が扱われています。分解すると、
        ^A     … A で始まる
        [CG]*  … C か G が 0 個以上続く
        [^CG]? … C でも G でもない文字が 0 個か 1 個
        T$     … T で終わる
      記号を一つずつ日本語に置き換えていけば、必ず読めます。

  - id: 6-06
    title: 番号の形式
    prompt: "{strings} から、ID- で始まり、そのあとが数字だけで終わる行を表示せよ。"
    solution: grep -E "^ID-[0-9]+$" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - 数字の集合と、「1 個以上の繰り返し」を組み合わせます。
      - "[0-9]+ が「数字が 1 個以上」です。-E を付けます。"
      - grep -E "^ID-[0-9]+$" {strings}
    explain: |
      + は「1 個以上」。* が「0 個以上」なので、
      * にすると数字が 1 つもない ID- も拾ってしまいます。
      この 0 か 1 かの差は、試験でも狙われるところです。

  - id: 6-07
    title: 回数を指定する
    prompt: "{strings} から、数字 4 桁 - 数字 2 桁 - 数字 2 桁 の形の行だけを表示せよ。"
    solution: grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - 繰り返す回数を波括弧で指定できます。
      - "[0-9]{4} が「数字ちょうど 4 個」です。"
      - grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" {strings}
    explain: |
      {n} はちょうど n 回、{n,} は n 回以上、{n,m} は n 回から m 回。
      これで 2026-5-1 のような桁の足りない書き方を弾けます。

  - id: 6-08
    title: どちらか
    prompt: "{strings} から、cat または dog を含む行を表示せよ。"
    solution: grep -E "cat|dog" {strings}
    alt_solutions:
      - grep "cat\|dog" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - 「または」を表す記号を使います。
      - "-E を付けて cat|dog と書きます。"
      - grep -E "cat|dog" {strings}
    explain: |
      catalog や concat も拾われます。「含む」だからです。
      cat という語だけを拾いたいなら ^cat$ や grep -w を使います。

  - id: 6-09
    title: それ以外
    prompt: "{strings} から、A で始まらない行を、正規表現だけで表示せよ。（-v は使わないこと）"
    solution: grep "^[^A]" {strings}
    judge:
      mode: stdout
    require_any: [grep]
    hints:
      - 角括弧の中に置いた ^ は「以外」を表します。
      - "行頭の ^ と、集合の中の ^ を重ねて ^[^A] と書きます。"
      - grep "^[^A]" {strings}
    explain: |
      ^ が 2 回出てきますが、意味は別物です。
        先頭の ^     … 行頭
        [ ] の中の ^ … 否定
      なお grep -v "^A" とは結果が微妙に違うことがあります。
      空行は [^A] に一致する文字を持たないため、この書き方では拾えません。

  - id: 6-10
    title: 星と足し算
    prompt: 正規表現の * と + の違いとして正しいものはどれか。番号で答えよ。
    choices:
      - "* は 0 回以上の繰り返し、+ は 1 回以上の繰り返し"
      - "* は 1 回以上の繰り返し、+ は 0 回以上の繰り返し"
      - どちらも同じ意味である
      - "* は任意の 1 文字、+ は任意の複数文字"
    judge:
      mode: text
    accept:
      - "1"
    solution: "1"
    hints:
      - 片方は「1 回も出てこなくてよい」を許します。
      - 星のほうが緩い。
      - "1"
    explain: |
      A* は「A が 0 個以上」なので、A がまったくない文字列にも一致します。
      A+ は最低 1 個必要。? は「0 個か 1 個」。
      この 3 つの違いは、選択問題で最も問われやすいところです。

  - id: 6-11
    title: 二つの星
    prompt: |
      シェルで打つ ls *.txt の * と、正規表現の * について正しいものはどれか。番号で答えよ。
    choices:
      - どちらも「任意の文字の並び」を表し、同じものである
      - シェルの * は「任意の文字の並び」、正規表現の * は「直前の要素の 0 回以上の繰り返し」で、別のもの
      - シェルの * は「直前の要素の繰り返し」、正規表現の * は「任意の文字の並び」
      - 正規表現に * という記号はない
    judge:
      mode: text
    accept:
      - "2"
    solution: "2"
    hints:
      - 正規表現の * は、単独では意味を持ちません。
      - 正規表現で「任意の文字の並び」に当たるのは .* です。
      - "2"
    explain: |
      ここは初学者が最も混乱するところです。
        ls *.txt      … シェルが展開する。* は「何文字でも」
        grep ".*txt"  … * は「直前の . の繰り返し」
      同じ記号が、場所によって別の意味を持ちます。
      grep のパターンを引用符で囲むのは、シェルに先に展開されるのを防ぐためでもあります。

  - id: 6-12
    title: 一致しないものを選ぶ
    prompt: |
      正規表現 A[CG]*[^CG]?T に、文字列全体が一致しないものはどれか。番号で答えよ。
    choices:
      - ACGT
      - ACT
      - ATTT
      - AGGT
    judge:
      mode: text
    accept:
      - "3"
    solution: "3"
    hints:
      - A で始まり T で終わる点は、4 つとも共通しています。
      - "[^CG]? が受け持てるのは、C でも G でもない文字「1 個まで」です。"
      - "3"
    explain: |
      ATTT を分解してみると、A のあと [CG]* は何も取れず（T は C でも G でもない）、
      [^CG]? が T を 1 個だけ取り、最後の T$ でもう 1 個。ここまでで ATT。
      4 文字目の T を受け持つ部分がなく、全体一致にはなりません。
      この「一致しないものを選ぶ」形式は入試でも使われます。手で分解する練習をしておくこと。
